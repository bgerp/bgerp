<!--ET_BEGIN articleNavBar-->
<div class="path">
    [#articleNavBar#]
</div>
<!--ET_END articleNavBar-->
<div class='blogm-article-title'>[#title#]<!--ET_BEGIN singleLink-->&nbsp;[#singleLink#]<!--ET_END singleLink--></div>

<div class='blogm-article-info'>
    <span class='blogm-comments-cnt linkWithIcon' title="|Брой коментари|*">[#commentsCnt#]</span>
    <span class="blogm-published-on">[#publishedOn#]</span>
    <!--ET_BEGIN author--><span class="blogm-author">[#author#]</span><!--ET_END author-->
    <span class="blogm-meta-categories">|в|* [#categories#]</span>
</div>
<div class='blogm-article-body'>
    [#body#]
    [#prevNextLinks#]
</div>
<!--ET_BEGIN SHARE_TOOLBAR-->
[#SHARE_TOOLBAR#]
<!--ET_END SHARE_TOOLBAR-->
<!--ET_BEGIN COMMENTS-->
<div class='blogm-comments'>
    <h3 class='blogm-comments-title'>|Коментари|*</h3>
    <!--ET_BEGIN COMMENT-->
    <div class='blogm-comment [#stateClass#]'>
        <div class='blogm-comment-avatar'>[#avatar#]</div>
        <div class='blogm-comment-main'>
            <div class='blogm-comment-head'>
                <span class='blogm-name'>[#name#]</span>
                <span class='blogm-date'>[#createdOn#]</span>
                <span class='blogm-status'>[#status#]</span>
            </div>
            <div class='blogm-comment-text'>[#comment#]</div>
        </div>
    </div>
    <!--ET_END COMMENT-->
</div>
<!--ET_END COMMENTS-->
<!--ET_BEGIN COMMENT_FORM-->
<div class='blogm-comment-form'>
    [#COMMENT_FORM#]
</div>
<!--ET_END COMMENT_FORM-->
