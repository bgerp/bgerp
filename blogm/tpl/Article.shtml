<!--ET_BEGIN articleNavBar-->
<div class="path">
    [#articleNavBar#]
</div>
<!--ET_END articleNavBar-->
<div class='blogm-article-title'>[#title#]<!--ET_BEGIN singleLink-->&nbsp;[#singleLink#]<!--ET_END singleLink--></div>

<div class='blogm-article-info'>
    <span class='blogm-comments-cnt linkWithIcon' title="|Брой коментари|*">[#commentsCnt#]</span>
    [#publishedOn#], [#author#] |в|* [#categories#] 
</div>
<div class='blogm-article-body'>
    [#body#]
    [#prevNextLinks#]
</div>
<!--ET_BEGIN SHARE_TOOLBAR-->
[#SHARE_TOOLBAR#]
<!--ET_END SHARE_TOOLBAR-->
<!--ET_BEGIN COMMENTS-->
<div class='blogm-comments'>
    <!--ET_BEGIN COMMENT-->
    <table class='blogm-comment clearfix21 [#stateClass#]' style='background-color:[#stateColor#]' cellpadding='10px'>
        <tr>
            <td class='blogm-comment-who' style="text-align:center">
                <div style='text-align:left;'>
                    <div class='blog-avatar'>
                        [#avatar#]
                    </div>
                    <div class='blogm-name'>
                        [#name#]
                    </div>
                    <div class='blogm-date'>
                        [#createdOn#]
                    </div>
                    <div class='blogm-status'>
                        [#status#]
                    </div>
                </div>
            </td>
            <td class='blogm-comment-text'>
                [#comment#]
            </td>
        </tr>
    </table>
    <div class='clearfix21'></div>
    <!--ET_END COMMENT-->
</div>
<!--ET_END COMMENTS-->
<!--ET_BEGIN COMMENT_FORM-->
<div class='blogm-comment-form'>
    [#COMMENT_FORM#]
</div>
<!--ET_END COMMENT_FORM-->
