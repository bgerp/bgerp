<div class='cms-row'>
    <!--ET_BEGIN NAVIGATION-->
    <div id='cmsNavigation' style='margin:2%'>
        [#TOP_NAV#]
        <div class='articles-navigation'>
            [#SEARCH_FORM#] [#TOGGLE_BTN#]
        </div>
        <div class="narrowNav">
            <!--ET_BEGIN WORKSHOP-->
            <div class='blogm-workshop'>
                [#WORKSHOP#]
            </div>
            <!--ET_END WORKSHOP-->
            <!--ET_BEGIN CATEGORIES-->
            <div class='blogm-categories'>
                <div class='nav_item  level1'>|Категории|*</div>
                [#CATEGORIES#]
            </div>
            <!--ET_END CATEGORIES-->
            <!--ET_BEGIN ARCHIVE-->
            <div class='blogm-archive'>
                <div class='nav_item  level1'>|Архив|*</div>
                [#ARCHIVE#]
            </div>
            <!--ET_END ARCHIVE-->
            <!--ET_BEGIN LINKS-->
            <div class='blogm-links'>
                <div class='nav_item  level1'>|Ние четем|*</div>
                [#LINKS#]
            </div>
            <!--ET_END LINKS-->
        </div>
        [#BOTTOM_NAV#]
    </div>
    <!--ET_END NAVIGATION-->
    <div style='padding:0 2% 0;'>
        [#TOP_CONTENT#]
        [#PAGE_CONTENT#]
        [#BOTTOM_CONTENT#]
        <div class='bulletin-link' style="margin-bottom: 20px;"></div>
    </div>
</div>
