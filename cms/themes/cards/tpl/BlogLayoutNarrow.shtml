<div class="cms-row commerce-blog-layout">
    <!--ET_BEGIN NAVIGATION-->
    <div id="cmsNavigation">
        [#TOP_NAV#]
        <div class='articles-navigation'>
            [#SEARCH_FORM#] [#TOGGLE_BTN#]
        </div>
        <div class="narrowNav">
            <!--ET_BEGIN WORKSHOP-->
            <div class='blogm-workshop'>
                [#WORKSHOP#]
            </div>
            <!--ET_END WORKSHOP-->
            <!--ET_BEGIN CATEGORIES-->
            <div class='blogm-categories'>
                <div class='nav_item  level1'>|Категории|*</div>
                [#CATEGORIES#]
            </div>
            <!--ET_END CATEGORIES-->
            <!--ET_BEGIN ARCHIVE-->
            <div class='blogm-archive'>
                <div class='nav_item  level1'>|Архив|*</div>
                [#ARCHIVE#]
            </div>
            <!--ET_END ARCHIVE-->
            <!--ET_BEGIN LINKS-->
            <div class='blogm-links'>
                <div class='nav_item  level1'>|Ние четем|*</div>
                [#LINKS#]
            </div>
            <!--ET_END LINKS-->
        </div>
        <div class="bulletin-link"></div>
        [#BOTTOM_NAV#]
    </div>
    <!--ET_END NAVIGATION-->
    <div class="commerce-blog-content searchContent">
        [#TOP_CONTENT#]
        [#PAGE_CONTENT#]
        [#BOTTOM_CONTENT#]
    </div>
</div>
