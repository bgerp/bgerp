<div class='eshop-product-list [#CLASS#]'>
    <!--ET_BEGIN code--><div class="executive-card-code">[#code#]</div><!--ET_END code-->
    <div class="eshop-card-media">
        [#image#]
        <!--ET_BEGIN hoverImage--><div class="b2b-card-hover-image" aria-hidden="true">[#hoverImage#]</div><!--ET_END hoverImage-->
    </div>
    <div class="eshop-card-content">
        <h2 class='eshop-product-list-name'><span class="b2b-card-title">[#name#]</span> [#singleLink#][#editLink#]</h2>
        <div class="eshop-card-meta">
            <!--ET_BEGIN coMoq--><span title='|Минимално количество за поръчка|*'>|Мин. количество||Min. quantity|*: <b>[#coMoq#]</b></span><!--ET_END coMoq-->
        </div>
        <!--ET_BEGIN saleInfo--><div class="eshop-card-sale-info">[#saleInfo#]</div><!--ET_END saleInfo-->
        <!--ET_BEGIN commonParams-->
        <div class='small b2b-card-features'>[#commonParams#]</div>
        <!--ET_END commonParams-->
        <div class="b2b-card-purchase">
        <!--ET_BEGIN catalogPrice-->
        <div class="eshop-card-price">[#catalogPrice#] <span class="eshop-card-price-tail">[#chargeVat#] <span>|за||per|* [#packagingId#]</span></span></div>
        <!--ET_END catalogPrice-->
        <div class="eshop-card-actions">[#btn#][#coInquiry#]</div>
        </div>
    </div>
</div>
